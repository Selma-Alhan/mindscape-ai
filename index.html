<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MindScape AI Task Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: coordination board — header band, fairness strip, then tabbed task / teacher / module views */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18202b; --muted:#5a6575; --line:#dde2e9;
  --accent:#12706a; --accent-soft:#e1f1ef; --warm:#b4532c; --warm-soft:#f8e9e1;
  --tr:#c2382e; --it:#2b8650; --hr:#2c5bb5; --pt:#a8731c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19202a; --ink:#e6eaf0; --muted:#9aa4b3; --line:#2a3340;
  --accent:#4dbdb3; --accent-soft:#183634; --warm:#e58c66; --warm-soft:#3a251c;
  --tr:#ef6a5f; --it:#5cc285; --hr:#6f98e8; --pt:#d9a447; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19202a; --ink:#e6eaf0; --muted:#9aa4b3; --line:#2a3340;
  --accent:#4dbdb3; --accent-soft:#183634; --warm:#e58c66; --warm-soft:#3a251c;
  --tr:#ef6a5f; --it:#5cc285; --hr:#6f98e8; --pt:#d9a447; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.1}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end}
.head-text{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:640px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font-size:13px;font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.fair{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.fair-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;cursor:pointer;border-radius:6px;padding:2px 4px}
.bar-row:hover,.bar-row.sel{background:var(--accent-soft)}
.bar-name{display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:14px;background:var(--bg);border-radius:4px;overflow:visible}
.seg-mod,.seg-task{position:absolute;top:0;bottom:0}
.seg-mod{background:var(--accent);border-radius:4px 0 0 4px}
.seg-task{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.avg{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--warm)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
@media (max-width:520px){.bar-row{grid-template-columns:96px 1fr 36px}}

.cc{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.05em;padding:1px 5px;border-radius:4px;color:var(--surface);flex:none}
.cc.TR{background:var(--tr)}.cc.IT{background:var(--it)}.cc.HR{background:var(--hr)}.cc.PT{background:var(--pt)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-family:var(--f-display);font-size:16px;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filter-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--accent-soft);padding:8px 12px;border-radius:8px}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0}

.phase{display:flex;flex-direction:column;gap:10px}
.phase-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr);gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.dim{opacity:.35}
.item-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.item-title{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:6px;min-width:0}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.role{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);width:62px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;font-size:14px;background:var(--bg)}
.chip.lead{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.mark{font-size:12px;font-family:var(--f-mono)}
.mark.ok{color:var(--accent)}
.mark.new{color:var(--warm)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.tag.new{color:var(--warm)}
.tag.form{color:var(--accent)}
select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--ink);max-width:100%}
@media (max-width:720px){.item{grid-template-columns:minmax(0,1fr)}}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tcard-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.score{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.tcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.tcard li{display:flex;gap:8px;font-size:14px;align-items:baseline}
.tcard li .r{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:54px;flex:none;text-transform:uppercase}
.meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}

.pref{font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pref.p1{color:var(--accent);border-color:var(--accent)}
.notes{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:760px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px}
textarea.fallback{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.tgrid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;min-width:0}
.mcard.t{border-top:3px solid var(--accent)}
.mcard.s{border-top:3px solid var(--warm)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mdate{font-family:var(--f-display);font-size:17px;font-weight:500}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.times>div{background:var(--bg);padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.times .eyebrow{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.times b{font-size:18px}
.ag{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.att{font-size:13.5px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:8px}
.cal{align-self:flex-start;text-decoration:none;font-size:13px}
.out{font-size:13px}
.out b{font-weight:700}
.draft{font-size:14px;color:var(--muted)}
.role{width:auto;min-width:62px}
.tcard li .r{width:auto;min-width:54px}
@media (prefers-reduced-motion:no-preference){.seg-mod,.seg-task{transition:width .25s ease,left .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <span class="eyebrow" id="eyebrow"></span>
      <h1>MindScape AI <span style="color:var(--accent)">·</span> <span id="h1sub"></span></h1>
      <p class="muted" id="lede"></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" type="button">EN</button>
        <button id="lang-tr" type="button">TR</button>
        <button id="lang-it" type="button">IT</button>
        <button id="lang-hr" type="button">HR</button>
        <button id="lang-pt" type="button">PT</button>
      </div>
      <button class="btn" id="btn-edit" type="button" aria-pressed="false"></button>
      <button class="btn" id="btn-copy" type="button"></button>
      <button class="btn" id="btn-reset" type="button"></button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="fair" aria-labelledby="fair-title">
    <div class="fair-head">
      <h2 id="fair-title"></h2>
      <span class="mono muted" id="fair-sum"></span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="filter"></div>
  <div id="view" style="display:flex;flex-direction:column;gap:26px"></div>
  <div id="fallback"></div>
  <div class="notes" id="notes"></div>
</div>
<div class="toast" id="toast" hidden></div>

(function applyXL(){
  for(const lg of ["it","hr","pt"]){
    const x=XL[lg];S[lg]=x.S;
    TASKS.forEach(t=>{const v=x.tasks[t.id];t.t[lg]=v[0];t.w[lg]=v[1];t.when[lg]=v[2];OUT[t.id][lg]=v[3]});
    MEETINGS.forEach(m=>{const v=x.meet[m.id];m.t[lg]=v[0];m.ag[lg]=v[1]});
    PHASES.forEach(p=>{const v=x.ph[p.id];p.t[lg]=v[0];p.d[lg]=v[1]});
    MODULES.forEach(m=>{m.t[lg]=m.t.en;m.when[lg]=x.months[m.when.en]});
    ORDER.forEach(id=>{T[id].role[lg]=x.roles[id];T[id].avail[lg]=availStr(lg,id)});
  }
})();

const KEY="mindscape-tasks-v7";
function defaults(){const a={};MODULES.forEach(m=>a[m.id]={lead:m.lead,sup:[...m.sup]});TASKS.forEach(t=>a[t.id]={lead:t.lead,sup:[...t.sup]});return a}
let A=defaults(), lang="en", tab=0, edit=false, sel=null;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s){if(s.a)A=Object.assign(defaults(),s.a);if(s.lang&&S[s.lang])lang=s.lang;if(typeof s.tab==="number")tab=s.tab}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:A,lang,tab}))}catch(e){}}

const L=()=>S[lang];
const first=id=>T[id].n.split(" ")[0];
const cc=c=>`<span class="cc ${c}">${c}</span>`;
function loads(){
  const r={};ORDER.forEach(id=>r[id]={m:0,t:0});
  MODULES.forEach(m=>{const a=A[m.id];if(a.lead)r[a.lead].m+=3;[...new Set(a.sup)].filter(x=>x&&x!==a.lead).forEach(x=>r[x].m+=1)});
  TASKS.forEach(t=>{const a=A[t.id];if(a.lead)r[a.lead].t+=2;[...new Set(a.sup)].filter(x=>x&&x!==a.lead).forEach(x=>r[x].t+=1)});
  return r;
}
function involved(id,item){const a=A[item.id];return a.lead===id||a.sup.includes(id)}

  stats.innerHTML=vals.map((v,i)=>`<div class="stat"><b class="mono" style="font-family:var(--f-display)">${v}</b><span class="muted">${s.stats[i]}</span></div>`).join("");
  document.getElementById("fair-title").textContent=s.fair;
  legend.innerHTML=`<span><i class="sw" style="background:var(--accent)"></i>${s.leg[0]}</span><span><i class="sw" style="background:color-mix(in srgb,var(--accent) 45%,var(--surface))"></i>${s.leg[1]}</span><span><i class="sw" style="background:none;border-left:2px dashed var(--warm);border-radius:0;width:2px"></i>${s.leg[2]}</span>`;
  tabs.innerHTML=s.tabs.map((x,i)=>`<button role="tab" type="button" id="tab-${i}" aria-selected="${i===tab}" data-tab="${i}">${x}</button>`).join("");
  notes.innerHTML=s.notes.map(n=>`<p>${n}</p>`).join("");
}

function renderBars(){
  const s=L(),r=loads();
  const tot=ORDER.map(id=>r[id].m+r[id].t);
  const mn=Math.min(...tot),mx=Math.max(...tot),av=(tot.reduce((a,b)=>a+b,0)/tot.length);
  const scale=Math.max(12,mx+1);
  document.getElementById("fair-sum").textContent=s.sum(mn,mx,av.toFixed(1).replace(".",lang==="en"?".":","));
  bars.innerHTML=ORDER.map(id=>{const x=r[id],t=x.m+x.t;return `<div class="bar-row ${sel===id?"sel":""}" data-person="${id}" role="button" tabindex="0" aria-label="${T[id].n}: ${t} ${s.pts}">
   <span class="bar-name">${cc(T[id].c)}${T[id].n}</span>
   <div class="track"><span class="seg-mod" style="left:0;width:${x.m/scale*100}%"></span><span class="seg-task" style="left:${x.m/scale*100}%;width:${x.t/scale*100}%"></span><span class="avg" style="left:${av/scale*100}%"></span></div>
   <span class="mono" style="text-align:right">${t}</span></div>`}).join("");
}

function personSelect(itemId,slot,val){
  const s=L();
  const opts=[`<option value="">${s.none}</option>`].concat(ORDER.map(id=>`<option value="${id}" ${id===val?"selected":""}>${T[id].c} · ${T[id].n}</option>`));
  return `<select id="sel-${itemId}-${slot}" data-item="${itemId}" data-slot="${slot}" aria-label="${slot==="lead"?s.lead:s.sup}">${opts.join("")}</select>`;
}
function chip(id,isLead,item){
  const s=L();let mark="";
  if(item.k){const ok=T[id].vol.includes(item.k);mark=`<span class="mark ${ok?"ok":"new"}" title="${ok?s.formok:s.formno}">${ok?"✓":"○"}</span>`}
  else if(item.id.startsWith("M")){const p=T[id].mp[item.id];mark=`<span class="pref ${p===1?"p1":""}">${p===1?s.pref1:p===2?s.pref2:s.nopref}</span>`}
  return `<span class="chip ${isLead?"lead":""}">${cc(T[id].c)}${T[id].n}${mark}</span>`;
}
function peopleBlock(item){
  const s=L(),a=A[item.id];
  if(edit){
    return `<div class="people"><div class="prow"><span class="role">${s.lead}</span>${personSelect(item.id,"lead",a.lead)}</div>
     <div class="prow"><span class="role">${s.sup}</span>${personSelect(item.id,"s0",a.sup[0]||"")}${personSelect(item.id,"s1",a.sup[1]||"")}</div></div>`;
  }
  const sup=a.sup.filter(Boolean);
  return `<div class="people"><div class="prow"><span class="role">${s.lead}</span>${a.lead?chip(a.lead,true,item):s.none}</div>
   <div class="prow"><span class="role">${s.sup}</span>${sup.length?sup.map(x=>chip(x,false,item)).join(""):s.none}</div></div>`;
}

function renderTasks(){
  const s=L();
  return PHASES.map(p=>{
    const items=TASKS.filter(t=>t.ph===p.id);
    return `<section class="phase"><div class="phase-head"><h2>${p.t[lang]}</h2><span class="when">${p.d[lang]}</span></div>
     <div class="list">${items.map(t=>`<div class="item ${sel&&!involved(sel,t)?"dim":""}">
       <div class="item-main"><div class="item-title"><h3>${t.t[lang]}</h3><span class="when">${t.when[lang]}</span></div>
        <p class="why">${t.w[lang]}</p>
        <p class="out"><b>${s.outL}:</b> ${OUT[t.id][lang]}</p>
        <div><span class="tag ${t.k?"form":"new"}">${t.k?s.formtask+" · "+FORMNAMES[t.k]:s.newtask}</span></div></div>
       ${peopleBlock(t)}</div>`).join("")}</div></section>`;
  }).join("");
}
function renderModules(){
  const s=L();
  return `<section class="phase"><div class="list">${MODULES.map(m=>`<div class="item ${sel&&!involved(sel,m)?"dim":""}">
    <div class="item-main"><div class="item-title"><h3>${m.id} · ${m.t[lang]}</h3><span class="when">${m.when[lang]}</span></div>
     <p class="why">${ORDER.filter(id=>T[id].mp[m.id]===1).map(first).join(", ")||s.nopref} <span class="muted">· ${s.pref1}</span></p></div>
    ${peopleBlock(m)}</div>`).join("")}</div></section>`;
}
function renderTeachers(){
  const s=L(),r=loads();
  return `<div class="tgrid">${ORDER.map(id=>{
    const p=T[id],x=r[id];
    const rows=[];
    MODULES.forEach(m=>{const a=A[m.id];if(a.lead===id)rows.push([s.rolesL,`${m.id} ${m.t[lang]}`,1]);else if(a.sup.includes(id))rows.push([s.rolesS,`${m.id} ${m.t[lang]}`,2])});
    TASKS.forEach(t=>{const a=A[t.id];const tx=`${t.t[lang]} <span class="when">· ${t.when[lang]}</span>`;if(a.lead===id)rows.push([s.rolesL,tx,3]);else if(a.sup.includes(id))rows.push([s.rolesS,tx,4])});
    MEETINGS.forEach(m=>{if(m.host.includes(id))rows.push([s.hostRole,`${m.t[lang]} <span class="when">· ${m.d.split("-").reverse().join(".")}</span>`,5])});
    rows.sort((a,b)=>a[2]-b[2]);
    return `<article class="tcard">
     <div class="tcard-head"><div><h3 style="display:flex;gap:7px;align-items:center">${cc(p.c)}${p.n}</h3><p class="muted" style="font-size:13px">${p.role[lang]}</p></div>
      <div style="text-align:right"><div class="score">${x.m+x.t}</div><span class="eyebrow">${s.pts}</span></div></div>
     <ul>${rows.map(r=>`<li><span class="r">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul>
     <div class="meta"><span>${s.avail}: ${p.avail[lang]}</span><span>${p.st} ${s.students}</span></div></article>`}).join("")}</div>`;
}

function mDate(m){const [y,mo,d]=m.d.split("-").map(Number);return new Date(Date.UTC(y,mo-1,d,m.utc))}
function hh(u,off){return String((u+off+24)%24).padStart(2,"0")+":00"}
function canAttend(id,m){const a=AV[id],dow=mDate(m).getUTCDay();return a.days.includes(dow)&&m.utc>=a.from&&m.utc<a.to}
function calLink(m){
  const s=L(),st=mDate(m),en=new Date(st.getTime()+3600e3);
  const f=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const det=m.ag[lang].map(a=>"• "+a).join("\n")+"\n\n"+s.revise;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("MindScape AI – "+m.t[lang])+"&dates="+f(st)+"/"+f(en)+"&details="+encodeURIComponent(det);
}
function renderMeetings(){
  const s=L();
  const dfmt=new Intl.DateTimeFormat(LOC[lang],{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  return `<p class="draft">${s.hostNote} ${s.revise}</p><div class="mgrid">${MEETINGS.map(m=>{
    const others=ORDER.filter(id=>!m.host.includes(id));
    const yes=others.filter(id=>canAttend(id,m)),no=others.filter(id=>!canAttend(id,m));
    return `<article class="mcard t">
     <div class="mhead"><span class="tag form">${s.tJoint}</span><span class="mono muted">${m.id}</span></div>
     <h3>${m.t[lang]}</h3>
     <p class="mdate">${dfmt.format(mDate(m))}</p>
     <div class="times"><div><span class="eyebrow">${s.zones[0]}</span><b class="mono">${hh(m.utc,3)}</b></div><div><span class="eyebrow">${s.zones[1]}</span><b class="mono">${hh(m.utc,1)}</b></div><div><span class="eyebrow">${s.zones[2]}</span><b class="mono">${hh(m.utc,0)}</b></div></div>
     <div class="prow"><span class="role">${s.host}</span>${m.host.map(id=>`<span class="chip lead">${cc(T[id].c)}${T[id].n}</span>`).join("")}</div>
     <div><span class="eyebrow">${s.agenda}</span><ul class="ag">${m.ag[lang].map(a=>`<li>${a}</li>`).join("")}</ul></div>
     <div class="att"><p><b>${s.canAttend}:</b> ${yes.map(first).join(", ")||"—"}</p><p class="muted">${s.cannot}: ${no.map(first).join(", ")||"—"}</p><p class="muted">${s.studentNote}</p></div>
     <a class="btn cal" href="${calLink(m)}" target="_blank" rel="noopener">${s.cal}</a>
    </article>`}).join("")}</div>`;
}

function renderView(){
  const s=L();
  filter.innerHTML=sel&&(tab===1||tab===3)?`<div class="filter-note">${cc(T[sel].c)}<span>${s.showing(T[sel].n)}</span><button class="linkbtn" type="button" id="btn-clear">${s.clear}</button></div>`:"";
  view.innerHTML=tab===0?renderMeetings():tab===1?renderTasks():tab===2?renderTeachers():renderModules();
}
function renderAll(){renderStatic();renderBars();renderView()}

function summaryText(){
  const s=L(),r=loads();
  const lines=[s.summaryTitle,"",s.tabs[0].toUpperCase()];
  MEETINGS.forEach(m=>lines.push(`  • ${m.d.split("-").reverse().join(".")} – ${m.t[lang]} – TR ${hh(m.utc,3)} / IT·HR ${hh(m.utc,1)} / PT ${hh(m.utc,0)} – ${s.host}: ${m.host.map(first).join(", ")}`));
  lines.push("",s.tabs[2].toUpperCase());
  ORDER.forEach(id=>{
    const x=r[id];lines.push(`${T[id].n} (${T[id].c}) – ${x.m+x.t} ${s.pts}`);
    MODULES.forEach(m=>{const a=A[m.id];if(a.lead===id)lines.push(`  • ${m.id} ${m.t[lang]} (${s.rolesL})`);else if(a.sup.includes(id))lines.push(`  • ${m.id} ${m.t[lang]} (${s.rolesS})`)});
    TASKS.forEach(t=>{const a=A[t.id];if(a.lead===id)lines.push(`  • ${t.t[lang]} – ${t.when[lang]} (${s.rolesL})`);else if(a.sup.includes(id))lines.push(`  • ${t.t[lang]} – ${t.when[lang]} (${s.rolesS})`)});
    lines.push("");
  });
  return lines.join("\n");
}
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-person]");if(!b)return;
  if(b.id&&b.id.startsWith("lang-")){lang=b.id.slice(5);save();renderAll();return}
  if(b.id==="btn-edit"){edit=!edit;renderAll();return}
  if(b.id==="btn-reset"){A=defaults();save();renderAll();toast(L().resetdone);return}
  if(b.id==="btn-clear"){sel=null;renderBars();renderView();return}
  if(b.id==="btn-copy"){
    const txt=summaryText();fallback.innerHTML="";
    const fb=()=>{fallback.innerHTML=`<p class="muted" style="margin-bottom:6px">${L().copyfail}</p><textarea class="fallback" id="fallback-text" readonly></textarea>`;const ta=document.getElementById("fallback-text");ta.value=txt;ta.focus();ta.select()};
    try{navigator.clipboard.writeText(txt).then(()=>toast(L().copied),fb)}catch(err){fb()}
    return}
  if(b.dataset.tab){tab=+b.dataset.tab;save();renderStatic();renderView();return}
  if(b.dataset.person){sel=sel===b.dataset.person?null:b.dataset.person;if(tab!==1&&tab!==3)tab=1;save();renderStatic();renderBars();renderView()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.person){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset.item)return;
  const a=A[el.dataset.item];
  if(el.dataset.slot==="lead")a.lead=el.value||null;
  else{const i=el.dataset.slot==="s0"?0:1;const sup=[a.sup[0]||"",a.sup[1]||""];sup[i]=el.value;a.sup=sup.filter(Boolean)}
  save();renderBars();if(tab===2)renderView();
});
renderAll();
</script>
</body>
</html>
